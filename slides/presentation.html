n Local Japanese Festivals", "url": "https://www.japan.travel/en/guide/get-involved-in-local-festivals/"}, {"id": "S03", "title": "瞭解並掌握日本的風俗習慣和禮儀", "url": "https://www.japan.travel/tw/guide/understanding-and-mastering-japanese-manners-and-etiquette/"}, {"id": "S04", "title": "日本飲食禮儀指南", "url": "https://www.japan.travel/tw/guide/japanese-food-etiquette/"}, {"id": "S06", "title": "Japanese Tea Ceremony", "url": "https://www.japan.travel/en/guide/tea-ceremony/"}, {"id": "S08", "title": "簡單日文", "url": "https://www.japan.travel/tw/plan/japanese-language/"}]}, {"no": 2, "title": "日本節日｜お祭り", "sub": "祭り・お正月・初詣", "body": "日本各地祭典形式多樣，可能包含神輿、屋台、太鼓和浴衣。年初參拜神社或寺院稱「初詣」。", "bullets": ["祭り（まつり）＝祭典", "初詣（はつもうで）＝新年首次參拜", "例句：家族と初詣に行きます。"], "emoji": "🏮", "sources": [{"id": "S01", "title": "Get Involved in Local Japanese Festivals", "url": "https://www.japan.travel/en/guide/get-involved-in-local-festivals/"}, {"id": "S02", "title": "Japan in January", "url": "https://www.japan.travel/en/guide/january/"}]}, {"no": 3, "title": "生活禮儀｜マナー", "sub": "お辞儀・玄関・温泉", "body": "鞠躬是常見問候方式；在住宅等場所通常在玄關脫鞋。溫泉入池前先清潔身體，仍應遵守個別設施規則。", "bullets": ["お辞儀（おじぎ）＝鞠躬", "玄関（げんかん）＝玄關", "例句：玄関で靴を脱ぎます。"], "emoji": "🌿", "sources": [{"id": "S03", "title": "瞭解並掌握日本的風俗習慣和禮儀", "url": "https://www.japan.travel/tw/guide/understanding-and-mastering-japanese-manners-and-etiquette/"}]}, {"no": 4, "title": "日本飲食文化｜和食", "sub": "旬の食材・出汁", "body": "和食重視季節食材和出汁的鮮味。日本用筷子時應避免把筷子直插飯碗，也避免以筷子直接傳接食物。", "bullets": ["和食（わしょく）＝日式飲食", "箸（はし）＝筷子", "例句：箸を使って食べます。"], "emoji": "🍵", "sources": [{"id": "S04", "title": "日本飲食禮儀指南", "url": "https://www.japan.travel/tw/guide/japanese-food-etiquette/"}, {"id": "S05", "title": "Japan’s Food Culture", "url": "https://www.japan.travel/en/sustainable/japans-food-culture/"}]}, {"no": 5, "title": "傳統文化｜伝統文化", "sub": "茶道・着物・浴衣", "body": "茶道結合奉茶儀式與待客之道。和服多見於特殊場合；浴衣相對輕便，在夏季祭典尤其常見。", "bullets": ["茶道（さどう）＝茶道", "着物（きもの）＝和服", "浴衣（ゆかた）＝浴衣"], "emoji": "🌸", "sources": [{"id": "S06", "title": "Japanese Tea Ceremony", "url": "https://www.japan.travel/en/guide/tea-ceremony/"}, {"id": "S07", "title": "Cultural Experiences in Japan", "url": "https://www.japan.travel/en/guide/cultural-experiences/"}]}, {"no": 6, "title": "日語與文化｜日本語", "sub": "あいさつ・すみません", "body": "學日語要看情境。同一句「すみません」可以用來道歉、引起注意，也可能含有感謝意思。", "bullets": ["こんにちは＝你好", "ありがとうございます＝謝謝", "すみません、駅はどこですか。＝不好意思，車站在哪？"], "emoji": "💬", "sources": [{"id": "S03", "title": "瞭解並掌握日本的風俗習慣和禮儀", "url": "https://www.japan.travel/tw/guide/understanding-and-mastering-japanese-manners-and-etiquette/"}, {"id": "S08", "title": "簡單日文", "url": "https://www.japan.travel/tw/plan/japanese-language/"}]}, {"no": 7, "title": "文化小測驗｜クイズ", "sub": "一起檢查今天學會多少", "body": "點選下方的答案，立即查看解釋。", "bullets": ["題目都依據本次 Wiki 條目整理。", "可重複作答，結果不會永久保存。"], "emoji": "✏️", "sources": [{"id": "S01", "title": "Get Involved in Local Japanese Festivals", "url": "https://www.japan.travel/en/guide/get-involved-in-local-festivals/"}, {"id": "S02", "title": "Japan in January", "url": "https://www.japan.travel/en/guide/january/"}, {"id": "S03", "title": "瞭解並掌握日本的風俗習慣和禮儀", "url": "https://www.japan.travel/tw/guide/understanding-and-mastering-japanese-manners-and-etiquette/"}, {"id": "S04", "title": "日本飲食禮儀指南", "url": "https://www.japan.travel/tw/guide/japanese-food-etiquette/"}, {"id": "S06", "title": "Japanese Tea Ceremony", "url": "https://www.japan.travel/en/guide/tea-ceremony/"}]}, {"no": 8, "title": "總結與來源", "sub": "学んだことを復習しよう", "body": "日本文化並非單一固定規則；理解場合、地區和對方的需求，是學習文化與語言的重要方法。", "bullets": ["節日：祭典與初詣", "禮儀：鞠躬與脫鞋", "飲食：和食與筷子", "傳統：茶道、和服、浴衣", "日語：按情境使用問候語"], "emoji": "📚", "sources": [{"id": "S01", "title": "Get Involved in Local Japanese Festivals", "url": "https://www.japan.travel/en/guide/get-involved-in-local-festivals/"}, {"id": "S02", "title": "Japan in January", "url": "https://www.japan.travel/en/guide/january/"}, {"id": "S03", "title": "瞭解並掌握日本的風俗習慣和禮儀", "url": "https://www.japan.travel/tw/guide/understanding-and-mastering-japanese-manners-and-etiquette/"}, {"id": "S04", "title": "日本飲食禮儀指南", "url": "https://www.japan.travel/tw/guide/japanese-food-etiquette/"}, {"id": "S05", "title": "Japan’s Food Culture", "url": "https://www.japan.travel/en/sustainable/japans-food-culture/"}, {"id": "S06", "title": "Japanese Tea Ceremony", "url": "https://www.japan.travel/en/guide/tea-ceremony/"}, {"id": "S07", "title": "Cultural Experiences in Japan", "url": "https://www.japan.travel/en/guide/cultural-experiences/"}, {"id": "S08", "title": "簡單日文", "url": "https://www.japan.travel/tw/plan/japanese-language/"}]}];const quizzes=[["初詣通常指什麼？", ["新年首次參拜", "烹調和食", "傳統樂器"], 0, "初詣是年初首次前往神社或寺院參拜。"], ["在日本，哪一種筷子用法應避免？", ["將筷子直插飯碗", "用筷子夾食物", "用餐前準備筷子"], 0, "把筷子直插飯中是日本餐桌禮儀的禁忌。"], ["「すみません」除了道歉還可能表示？", ["不好意思／請問", "一定是再見", "只用於價格詢問"], 0, "視情境也可用於引起注意或帶有感謝含義。"], ["「浴衣」較常在哪些情境出現？", ["夏日祭典", "正式喪禮一律穿浴衣", "辦公室每日制服"], 0, "浴衣是較輕便的傳統服飾，夏日祭典常見。"], ["茶道主要與哪種飲品有關？", ["抹茶", "汽水", "咖啡"], 0, "茶道常以準備、奉上抹茶的傳統程序為核心。"]];const el=id=>document.getElementById(id);let pos=0;const marks={};function esc(x){return String(x).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function paint(){const s=slides[pos];el('slide').innerHTML=`<div class="body"><div class="tag">NIHONGO BUDDY · CULTURE LESSON <span style="float:right">${s.no} / 8</span></div><div style="font-size:3rem">${s.emoji}</div><h1 class="big">${esc(s.title)}</h1><p class="jp" lang="ja">${esc(s.sub)}</p><p style="font-size:1.2rem;max-width:800px">${esc(s.body)}</p><div class="points">${s.bullets.map(b=>`<div class="point">${esc(b)}</div>`).join('')}</div>${pos===6?`<div id="quiz" class="card" style="background:#faf4ed"></div>`:''}<div class="source-links">${s.sources.map(o=>`<a href="${o.url}" target="_blank" rel="noopener noreferrer">來源 ${o.id} · ${esc(o.title)}</a>`).join('')}</div></div>`;if(pos===6)quizPaint();el('counter').textContent=`第 ${pos+1} / 8 頁`;el('progress').style.width=((pos+1)/8*100)+'%';el('prev').disabled=pos===0;el('next').textContent=pos===7?'回到首頁':'下一頁 →'}function quizPaint(){let x=0;function show(){let q=quizzes[x];el('quiz').innerHTML=`<p class="tag">QUIZ ${x+1} / ${quizzes.length}</p><h3>${esc(q[0])}</h3><div class="quizrow">${q[1].map((v,i)=>`<button class="btn alt" data-v="${i}">${esc(v)}</button>`).join('')}</div><div id="feedback" role="status" style="min-height:45px;margin-top:9px"></div><button id="more" class="btn" style="display:none">${x+1===quizzes.length?'重新作答':'下一題 →'}</button>`;document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{let correct=+b.dataset.v===q[2];el('feedback').textContent=(correct?'✓ 正確！':'✕ 答錯了。')+' '+q[3];el('more').style.display='inline-block';document.querySelectorAll('[data-v]').forEach(y=>y.disabled=true)});el('more').onclick=()=>{x=x+1===quizzes.length?0:x+1;show()}}show()}el('prev').onclick=()=>{if(pos>0){pos--;paint()}};el('next').onclick=()=>{pos=(pos+1)%8;paint()};window.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){pos=(pos+1)%8;paint()}if(e.key==='ArrowLeft'&&pos>0){pos--;paint()}});paint();</script></body></html>
