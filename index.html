<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nihongo Buddy｜日本文化探索 Wiki</title><style>*{box-sizing:border-box}body{margin:0;background:#fbf8f0;color:#234b45;font-family:system-ui,-apple-system,"Noto Sans TC","Noto Sans JP",sans-serif;line-height:1.7}a{color:#19776d}button,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #e6a69f;outline-offset:3px}.shell{max-width:1120px;margin:auto;padding:24px}.top{background:#235b55;color:white;padding:26px 0;border-bottom:5px solid #d9a6a2}.top h1{margin:0;font-size:clamp(1.6rem,3.5vw,2.6rem)}.top p{margin:5px 0 0;color:#def0eb}.chip{display:inline-block;background:#f5e4dc;color:#8b534e;border-radius:40px;padding:5px 13px;font-size:.8rem;margin:4px}.card{background:white;border:1px solid #e4dfd2;border-radius:20px;padding:23px;box-shadow:0 8px 24px #234b4510}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}.muted{color:#647b74}.small{font-size:.87rem}.tag{font-size:.8rem;font-weight:700;color:#b26863;letter-spacing:.08em}.btn{border:0;border-radius:11px;background:#235b55;color:white;padding:10px 17px}.btn.alt{background:#f1e8e0;color:#235b55}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.search{width:100%;padding:13px;border:1px solid #bfcfc5;border-radius:12px;background:white}h2,h3{line-height:1.35}h2{margin-top:0}.vocab{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px}.vocab>div{background:#f3f8f5;padding:12px;border-radius:10px}.source{font-size:.87rem;overflow-wrap:anywhere}.back{position:sticky;top:8px;z-index:5}.leaf{font-size:1.7rem;color:#cc8787}footer{text-align:center;color:#6d8179;padding:30px}</style></head><body><header class="top"><div class="shell"><span class="leaf">✿</span><h1>日本文化探索 Wiki</h1><p>Nihongo Buddy · 日本の文化を学ぼう · 8 篇來源 / 10 篇整理條目</p></div></header><main class="shell"><section id="overview"><div class="card" style="margin-bottom:22px"><h2>從文化學日語</h2><p>節日、禮儀、飲食、傳統及日語用法。每篇都有日文詞彙、生活例句、冷知識、來源與小測驗。</p><label for="search">搜尋文化主題或日文詞彙</label><input id="search" class="search" placeholder="例如：浴衣、筷子、すみません"><nav id="filters" class="row" style="margin-top:14px" aria-label="文化分類"></nav></div><div id="list" class="grid"></div></section><section id="detail" hidden></section></main><footer>資料來源主要為日本觀光局 JNTO。教學用整理，不代表日本各地文化完全一致。<br><a href="slides/presentation.html">開啟 8 頁 HTML 教學簡報 →</a></footer><script>const entries=[{"id": "matsuri", "category": "日本節日", "title": "祭典與夏日活動", "japanese_title": "祭りと夏祭り", "description_zh": "祭典有時與地方神社、歷史事件或社區活動有關。常見的元素包括神輿、山車、太鼓、浴衣和屋台。不是每場祭典都可以自由加入遊行，參加前應先確認當地規則。", "description_ja": "地域によって祭りの行事は違います。屋台や踊りを楽しめる祭りもあります。", "vocabulary": [{"word": "祭り", "kana": "まつり", "zh": "祭典"}, {"word": "神輿", "kana": "みこし", "zh": "神轎"}, {"word": "屋台", "kana": "やたい", "zh": "攤販"}], "scene_ja": "夏祭りで屋台を見ます。", "scene_zh": "在夏日祭典逛攤販。", "fun_fact": "神輿由人抬行，山車則通常是牽引的花車；兩者並不相同。", "sources": ["S01", "S07"], "related": ["hatsumode", "kimono"], "quiz": {"question": "「祭り」的中文意思是什麼？", "options": ["祭典", "一種日本貨幣", "日語中的過去式"], "answer": 0, "explanation": "「祭り（まつり）」是「祭典」。"}, "review_date": "2026-11-22"}, {"id": "hatsumode", "category": "日本節日", "title": "日本新年與初詣", "japanese_title": "お正月と初詣", "description_zh": "日本的新年是重要家庭節日。年初首次到神社或寺院參拜稱作初詣，許多地方也會設置攤販。初詣不一定只能在元旦當天完成。", "description_ja": "お正月には家族で過ごす人が多いです。初詣では神社やお寺に行きます。", "vocabulary": [{"word": "お正月", "kana": "おしょうがつ", "zh": "新年"}, {"word": "初詣", "kana": "はつもうで", "zh": "新年首次參拜"}, {"word": "神社", "kana": "じんじゃ", "zh": "神社"}], "scene_ja": "家族と初詣に行きます。", "scene_zh": "和家人一起去新年參拜。", "fun_fact": "初詣既可到神社，也可到寺院。", "sources": ["S02"], "related": ["matsuri", "manners"], "quiz": {"question": "「お正月」的中文意思是什麼？", "options": ["新年", "一種日本貨幣", "日語中的過去式"], "answer": 0, "explanation": "「お正月（おしょうがつ）」是「新年」。"}, "review_date": "2026-11-22"}, {"id": "manners", "category": "生活禮儀", "title": "鞠躬與室內脫鞋", "japanese_title": "お辞儀と靴のマナー", "description_zh": "鞠躬是日本常見的問候及表達敬意方式，但正式程度會依場合變化。進入住宅、部分旅館和榻榻米空間通常需要脫鞋；如果不清楚，應留意標示或詢問。", "description_ja": "あいさつの時にお辞儀をすることがあります。家に入る前に靴を脱ぎます。", "vocabulary": [{"word": "お辞儀", "kana": "おじぎ", "zh": "鞠躬"}, {"word": "靴", "kana": "くつ", "zh": "鞋子"}, {"word": "玄関", "kana": "げんかん", "zh": "玄關"}], "scene_ja": "玄関で靴を脱ぎます。", "scene_zh": "在玄關脫鞋。", "fun_fact": "日式旅館的拖鞋規定可能依場所不同；榻榻米區域往往不穿拖鞋。", "sources": ["S03"], "related": ["language", "tea"], "quiz": {"question": "「お辞儀」的中文意思是什麼？", "options": ["鞠躬", "一種日本貨幣", "日語中的過去式"], "answer": 0, "explanation": "「お辞儀（おじぎ）」是「鞠躬」。"}, "review_date": "2026-11-22"}, {"id": "onsen", "category": "生活禮儀", "title": "溫泉與公共浴池", "japanese_title": "温泉と入浴マナー", "description_zh": "泡溫泉或大眾浴池之前，通常應先清洗身體。毛巾不放入公共浴池，且各設施對服裝、刺青及混浴規定可能不同，需以現場規則為準。", "description_ja": "温泉に入る前に体を洗います。施設のルールを確認しましょう。", "vocabulary": [{"word": "温泉", "kana": "おんせん", "zh": "溫泉"}, {"word": "お風呂", "kana": "おふろ", "zh": "浴池／洗澡"}, {"word": "体", "kana": "からだ", "zh": "身體"}], "scene_ja": "温泉に入る前に体を洗います。", "scene_zh": "入溫泉前先洗身體。", "fun_fact": "溫泉並非全部採相同規定；可先確認是否設有私人浴池。", "sources": ["S03"], "related": ["manners"], "quiz": {"question": "「温泉」的中文意思是什麼？", "options": ["溫泉", "一種日本貨幣", "日語中的過去式"], "answer": 0, "explanation": "「温泉（おんせん）」是「溫泉」。"}, "review_date": "2026-11-22"}, {"id": "washoku", "category": "日本飲食文化", "title": "和食與當季食材", "japanese_title": "和食と旬の食材", "description_zh": "和食不只指壽司，也涵蓋各式料理與地方飲食。日本傳統飲食經常重視當季食材與高湯帶來的鮮味，並因季節和地區出現多樣變化。", "description_ja": "和食では旬の食材を大切にします。地域によって料理も違います。", "vocabulary": [{"word": "和食", "kana": "わしょく", "zh": "日式傳統飲食"}, {"word": "旬", "kana": "しゅん", "zh": "當季"}, {"word": "出汁", "kana": "だし", "zh": "高湯"}], "scene_ja": "今日は和食を食べます。", "scene_zh": "今天吃日式料理。", "fun_fact": "和食的「鮮味」常由昆布或鰹魚等材料熬出的出汁形成。", "sources": ["S04", "S05"], "related": ["table", "tea"], "quiz": {"question": "「和食」的中文意思是什麼？", "options": ["日式傳統飲食", "一種日本貨幣", "日語中的過去式"], "answer": 0, "explanation": "「和食（わしょく）」是「日式傳統飲食」。"}, "review_date": "2026-11-22"}, {"id": "table", "category": "日本飲食文化", "title": "筷子與餐桌禮儀", "japanese_title": "箸と食事のマナー", "description_zh": "日本用餐時有一些特別需要避免的用筷方式，例如將筷子直插飯中，或以筷子將食物直接傳遞給另一雙筷子。實際用餐還需遵守餐廳規定與同桌禮貌。", "description_ja": "箸をご飯に立てないでください。箸から箸へ食べ物を渡さないでください。", "vocabulary": [{"word": "箸", "kana": "はし", "zh": "筷子"}, {"word": "ご飯", "kana": "ごはん", "zh": "白飯／飯"}, {"word": "食事", "kana": "しょくじ", "zh": "用餐"}], "scene_ja": "箸を使って食べます。", "scene_zh": "使用筷子吃飯。", "fun_fact": "筷子直插飯碗和筷子傳接食物在日本都是重要禁忌。", "sources": ["S04"], "related": ["washoku", "manners"], "quiz": {"question": "「箸」的中文意思是什麼？", "options": ["筷子", "一種日本貨幣", "日語中的過去式"], "answer": 0, "explanation": "「箸（はし）」是「筷子」。"}, "review_date": "2026-11-22"}, {"id": "tea", "category": "傳統文化", "title": "茶道與款待", "japanese_title": "茶道とおもてなし", "description_zh": "日本茶道不只是喝茶，而是依一定程序準備與奉茶的傳統文化。茶道可稱茶の湯或茶道，重視環境、動作和待客時的體貼；各流派在程序上也可能略有不同。", "description_ja": "茶道ではお茶を点てて客をもてなします。流派によって作法は少し違います。", "vocabulary": [{"word": "茶道", "kana": "さどう／ちゃどう", "zh": "茶道"}, {"word": "抹茶", "kana": "まっちゃ", "zh": "抹茶"}, {"word": "おもてなし", "kana": "おもてなし", "zh": "待客之道"}], "scene_ja": "茶道を体験したいです。", "scene_zh": "我想體驗茶道。", "fun_fact": "正式茶會與較輕鬆的茶會形式不同，初學者可從體驗活動開始。", "sources": ["S06"], "related": ["kimono", "manners"], "quiz": {"question": "「茶道」的中文意思是什麼？", "options": ["茶道", "一種日本貨幣", "日語中的過去式"], "answer": 0, "explanation": "「茶道（さどう／ちゃどう）」是「茶道」。"}, "review_date": "2026-11-22"}, {"id": "kimono", "category": "傳統文化", "title": "和服與浴衣", "japanese_title": "着物と浴衣", "description_zh": "和服是日本傳統服裝，現今常見於婚禮等特別場合。浴衣相對輕便，常在夏日祭典或部分住宿場合出現。穿著規則也會因場合不同而變化。", "description_ja": "着物は特別な日に着ることがあります。浴衣は夏祭りでもよく見られます。", "vocabulary": [{"word": "着物", "kana": "きもの", "zh": "和服"}, {"word": "浴衣", "kana": "ゆかた", "zh": "浴衣"}, {"word": "夏祭り", "kana": "なつまつり", "zh": "夏日祭典"}], "scene_ja": "夏祭りで浴衣を着ます。", "scene_zh": "參加夏日祭典時穿浴衣。", "fun_fact": "浴衣可視為較輕便的和服形式，但不等於所有場合都適合穿浴衣。", "sources": ["S07", "S01"], "related": ["matsuri", "tea"], "quiz": {"question": "「着物」的中文意思是什麼？", "options": ["和服", "一種日本貨幣", "日語中的過去式"], "answer": 0, "explanation": "「着物（きもの）」是「和服」。"}, "review_date": "2026-11-22"}, {"id": "language", "category": "日語與文化", "title": "問候與不好意思", "japanese_title": "あいさつと「すみません」", "description_zh": "日本旅行時，除了早安、你好、謝謝等問候語，すみません也十分實用。依情境可表示不好意思、請問、歉意或對他人幫忙的感謝。理解情境比只背單一翻譯更重要。", "description_ja": "「すみません」は謝る時だけでなく、人に声をかける時にも使います。", "vocabulary": [{"word": "おはようございます", "kana": "おはようございます", "zh": "早安"}, {"word": "こんにちは", "kana": "こんにちは", "zh": "你好／午安"}, {"word": "すみません", "kana": "すみません", "zh": "不好意思／請問"}], "scene_ja": "すみません、駅はどこですか。", "scene_zh": "不好意思，請問車站在哪裡？", "fun_fact": "すみません有時也帶有感謝含意，但並非所有「謝謝」都能無條件替換。", "sources": ["S03", "S08"], "related": ["manners", "travel"], "quiz": {"question": "「おはようございます」的中文意思是什麼？", "options": ["早安", "一種日本貨幣", "日語中的過去式"], "answer": 0, "explanation": "「おはようございます（おはようございます）」是「早安」。"}, "review_date": "2026-11-22"}, {"id": "travel", "category": "日語與文化", "title": "旅行問路與詢價", "japanese_title": "道を聞く・値段を聞く", "description_zh": "問路或購物時，可以先說すみません，再提出問題。どこですか表示「在哪裡」，いくらですか用來詢問價格。這些短句適合初學者在旅行中練習。", "description_ja": "道を聞く時は「すみません」と声をかけると丁寧です。", "vocabulary": [{"word": "駅", "kana": "えき", "zh": "車站"}, {"word": "どこ", "kana": "どこ", "zh": "哪裡"}, {"word": "いくら", "kana": "いくら", "zh": "多少錢"}], "scene_ja": "すみません、これはいくらですか。", "scene_zh": "不好意思，請問這個多少錢？", "fun_fact": "同一句「すみません」可依後文變成問路、詢價或道歉的開場白。", "sources": ["S08", "S03"], "related": ["language"], "quiz": {"question": "「駅」的中文意思是什麼？", "options": ["車站", "一種日本貨幣", "日語中的過去式"], "answer": 0, "explanation": "「駅（えき）」是「車站」。"}, "review_date": "2026-11-22"}];const sources={"S01": {"title": "Get Involved in Local Japanese Festivals", "url": "https://www.japan.travel/en/guide/get-involved-in-local-festivals/"}, "S02": {"title": "Japan in January", "url": "https://www.japan.travel/en/guide/january/"}, "S03": {"title": "瞭解並掌握日本的風俗習慣和禮儀", "url": "https://www.japan.travel/tw/guide/understanding-and-mastering-japanese-manners-and-etiquette/"}, "S04": {"title": "日本飲食禮儀指南", "url": "https://www.japan.travel/tw/guide/japanese-food-etiquette/"}, "S05": {"title": "Japan’s Food Culture", "url": "https://www.japan.travel/en/sustainable/japans-food-culture/"}, "S06": {"title": "Japanese Tea Ceremony", "url": "https://www.japan.travel/en/guide/tea-ceremony/"}, "S07": {"title": "Cultural Experiences in Japan", "url": "https://www.japan.travel/en/guide/cultural-experiences/"}, "S08": {"title": "簡單日文", "url": "https://www.japan.travel/tw/plan/japanese-language/"}};let currentCategory='全部';let query='';const categories=['全部',...new Set(entries.map(x=>x.category))];const byId=Object.fromEntries(entries.map(x=>[x.id,x]));const el=id=>document.getElementById(id);function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function renderFilters(){el('filters').innerHTML=categories.map(c=>`<button class="btn ${c===currentCategory?'':'alt'}" data-cat="${safe(c)}">${safe(c)}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{currentCategory=b.dataset.cat;renderFilters();renderList()})}function renderList(){let found=entries.filter(a=>(currentCategory==='全部'||a.category===currentCategory)&&`${a.title} ${a.japanese_title} ${a.description_zh} ${a.vocabulary.map(v=>v.word).join(' ')}`.toLowerCase().includes(query.toLowerCase()));el('list').innerHTML=found.map(a=>`<article class="card"><div class="tag">${safe(a.category)}</div><h3>${safe(a.title)}</h3><p class="muted">${safe(a.japanese_title)}</p><p>${safe(a.description_zh.slice(0,85))}…</p><button class="btn" data-article="${a.id}">閱讀條目</button></article>`).join('')||'<p>找不到符合條件的條目。</p>';document.querySelectorAll('[data-article]').forEach(b=>b.onclick=()=>showArticle(b.dataset.article))}function showArticle(id){const a=byId[id];if(!a)return;el('overview').hidden=true;el('detail').hidden=false;el('detail').innerHTML=`<button class="btn alt back" id="back">← 返回 Wiki</button><article class="card"><span class="chip">${safe(a.category)}</span><h1>${safe(a.title)}</h1><h2 lang="ja">${safe(a.japanese_title)}</h2><h3>文化介紹</h3><p>${safe(a.description_zh)}</p><h3>やさしい日本語</h3><p lang="ja">${safe(a.description_ja)}</p><h3>日文詞彙</h3><div class="vocab">${a.vocabulary.map(v=>`<div><strong lang="ja">${safe(v.word)}</strong><div class="muted">${safe(v.kana)}</div><div>${safe(v.zh)}</div></div>`).join('')}</div><h3>生活情境</h3><p lang="ja">${safe(a.scene_ja)}</p><p>${safe(a.scene_zh)}</p><h3>文化冷知識</h3><p>${safe(a.fun_fact)}</p><h3>相關條目</h3><div class="row">${a.related.map(k=>`<button class="btn alt" data-related="${k}">${safe(byId[k]?.title||k)}</button>`).join('')}</div><h3>文化小測驗</h3><p>${safe(a.quiz.question)}</p><div class="row">${a.quiz.options.map((o,i)=>`<button class="btn alt" data-answer="${i}">${safe(o)}</button>`).join('')}</div><p id="feedback" role="status"></p><h3>參考來源</h3>${a.sources.map(s=>`<p class="source">[${s}] <a href="${sources[s].url}" target="_blank" rel="noopener noreferrer">${safe(sources[s].title)}</a></p>`).join('')}<p class="small muted">簡化的中文與初級日文為教學改寫；教學例句非來源原句。查證：${safe(a.review_date)}。</p></article>`;el('back').onclick=()=>{el('detail').hidden=true;el('overview').hidden=false;window.scrollTo(0,0)};document.querySelectorAll('[data-related]').forEach(b=>b.onclick=()=>{showArticle(b.dataset.related);window.scrollTo(0,0)});document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{let correct=Number(b.dataset.answer)===a.quiz.answer;el('feedback').textContent=(correct?'✓ 答對了！':'✕ 再試試。')+' '+a.quiz.explanation});window.scrollTo(0,0)}el('search').addEventListener('input',e=>{query=e.target.value;renderList()});renderFilters();renderList();</script></body></html>
